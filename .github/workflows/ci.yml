name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
            cgo: '1'
          - os: ubuntu-22.04
            go: '1.15.15'
            cgo: '0'
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Unit tests
        run: go test -count=1 -timeout=2m ./...
      - name: Race tests
        if: matrix.go == 'stable'
        run: go test -race -count=1 -timeout=2m ./...
      - name: Vet (including integration tests)
        run: go vet -tags=integration ./...

  integration:
    name: FUSE integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse
          test -c /dev/fuse
      - name: Mount tests
        run: go test -tags=integration -count=1 -timeout=5m ./...

  test-result:
    name: CI Passed
    needs: [test, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
